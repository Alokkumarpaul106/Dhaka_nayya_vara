{% extends "base.html" %}

{% block content %}
  <div class="max-w-6xl mx-auto px-0 py-8">
    <div class="mb-4">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800"><i class="fa-solid fa-route text-blue-600"></i> রুট তালিকা</h1>
      <p class="text-sm text-slate-500">ঢাকার বিভিন্ন বাসের রুট, শুরুর স্টপেজ ও শেষ স্টপেজের তালিকা দেখুন।</p>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-4">
      {% for route in routes %}
        <div class="bg-white rounded-lg shadow-md p-4">
          <h2 class="text-xs sm:text-lg font-semibold text-brand">{{ route.name }}</h2>
          <p class="text-xs font-semibold text-green-700 bg-green-50 border border-green-100 px-3 py-1.5 rounded-full inline-block">Active</p>
        </div>
      {% endfor %}
    </div>
  </div>
{% endblock %}
