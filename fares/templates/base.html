{% load l10n %}
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🚌ন্যায্য ভাড়া</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: "#1F4E78",
              dark: "#173b5a",
              light: "#EAF2F8"
            }
          },
          fontFamily: {
            sans: ['"Noto Sans Bengali"', "Kalpurush", '"Nirmala UI"', "Arial", "sans-serif"]
          },
          boxShadow: {
            soft: "0 8px 30px rgba(15, 45, 75, 0.07)"
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: "Noto Sans Bengali", "Kalpurush", "Nirmala UI", Arial, sans-serif;
    }

    .hero-bg {
      background: linear-gradient(120deg, #173b5a 0%, #1F4E78 55%, #2876a8 100%);
    }

    .select-box {
      transition: all .2s ease;
    }

    .select-box:focus {
      border-color: #1F4E78;
      box-shadow: 0 0 0 3px rgba(31, 78, 120, .10);
    }

    .bus-card {
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    .bus-card:hover {
      transform: translateY(-5px);
      border-color: #93c5fd;
      box-shadow: 0 12px 30px rgba(15, 45, 75, .10);
    }

    #map {
      min-height: 380px;
      width: 100%;
      z-index: 1;
    }

    @media(max-width: 640px) {
      #map {
        min-height: 300px;
      }
    }
  </style>
</head>



<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- ========== Navbar (<body> ট্যাগের ঠিক পরে বসাও) ========== -->
  <nav class="sticky top-0 z-50 bg-brand-dark/95 backdrop-blur border-b border-white/10 text-white">

    <div class="relative max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">

      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 font-bold text-lg">
        <span class="text-2xl"><i class="fa-solid fa-bus text-blue-500 shadow-soft"></i></span>
        <span>ন্যায্য ভাড়া</span>
      </a>
      <p class="sm:hidden text-xs sm:text-sm text-blue-100 whitespace-nowrap">যতটুকু পথ, ততটুকু ভাড়া</p>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a href="/" class="px-4 py-2 rounded-lg hover:bg-white/10 transition">হোম</a>
        <a href="{% url 'route_list'%}" class="px-4 py-2 rounded-lg hover:bg-white/10 transition">রুটসমূহ</a>
        <a href="{% url 'bus_list' %}" class="px-4 py-2 rounded-lg hover:bg-white/10 transition">বাসসমূহ</a>
        <a href="{% url 'complaints' %}" class="px-4 py-2 rounded-lg hover:bg-white/10 transition">অভিযোগ</a>
        <!-- <a href="/admin/" class="ml-3 px-4 py-2 rounded-lg bg-white text-brand font-semibold hover:bg-blue-50 transition">অ্যাডমিন</a> -->
      </div>

      <!-- Mobile Menu Button -->
      <button type="button" aria-label="মেনু"
              onclick="document.getElementById('mobileMenu').classList.toggle('hidden')"
              class="md:hidden w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 text-2xl">
        <i class="fa-solid fa-bars"></i>
      </button>

    </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="hidden md:hidden border-t border-white/10 px-5 pb-4 pt-2 text-base">
      <a href="/" class="block py-3 border-b border-white/10">হোম</a>
      <a href="{% url 'route_list' %}" class="block py-3 border-b border-white/10">রুটসমূহ</a>
      <a href="{% url 'bus_list' %}" class="block py-3 border-b border-white/10">বাসসমূহ</a>
      <a href="{% url 'complaints' %}" class="block py-3 border-b border-white/10">অভিযোগ</a>
      <!-- <a href="/admin/" class="block py-3 font-semibold">অ্যাডমিন</a> -->
    </div>

  </nav>

    <main class="max-w-7xl mx-auto px-5 py-3">
        {% block content %}{% endblock %}
    </main>


<!-- Footer -->
  <footer class="mt-8 bg-white border-t border-slate-200">

    <div class="max-w-7xl mx-auto px-5 py-6 text-center">

      <h3 class="font-bold text-brand"><i class="fa-solid fa-bus text-blue-500"></i> ন্যায্য ভাড়া</h3>

      <p class="text-xs text-slate-400 mt-2">যতটুকু পথ, ততটুকু ভাড়া</p>

      <p class="text-xs text-slate-400 mt-1">© 2026 All Rights Reserved. Created by <i class="fa-brands fa-python"></i><a href="https://alok-portfolio-7xow.onrender.com/" class="text-brand hover:underline">ALok.Dev</a></p>

    </div>

  </footer>
